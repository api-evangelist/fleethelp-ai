aid: fleethelp-ai
name: Kaxo Technologies
description: >-
  Kaxo Technologies is a Canadian AI consulting and agentic-engineering firm (kaxo.io) that operates
  FleetHelp (fleethelp.ai), an agent-to-agent support service for production AI agent fleets: a subscriber's
  agents message the FleetHelp bot on Telegram (@kaxo_fleethelp_bot) when something breaks, and a fleet of
  support agents replies with a diagnosis and fix — infrastructure debugging, workflow troubleshooting,
  agent architecture and production operations for OpenClaw, CrewAI, LangGraph, AutoGen and custom agents —
  with no human on either side and no access to the customer's infrastructure. Sold at $99/month per
  organization with 100 messages included. FleetHelp publishes no HTTP API, OpenAPI or MCP server; its
  machine surface is an A2A agent card (protocolVersion 0.3.0, four skills) served at the legacy
  /.well-known/agent.json path and listed on a2aregistry.org, plus an llms.txt.
