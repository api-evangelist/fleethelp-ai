apis:
- aid: fleethelp-ai:fleethelp-support-agent
  name: FleetHelp Support Agent (A2A)
  description: >-
    Agent2Agent (A2A) surface: an agent card served from https://fleethelp.ai/.well-known/agent.json
    (protocolVersion 0.3.0, version 1.0.0, authentication "none") advertising four text/plain skills —
    infrastructure-debugging, workflow-troubleshooting, architecture-guidance and production-operations.
    The card's url is the site root https://fleethelp.ai, which answered HTTP 405 to a JSON-RPC 2.0 POST on
    2026-09-19; no A2A transport endpoint was reachable. The service is delivered through the Telegram bot
    @kaxo_fleethelp_bot to paying subscribers, which the card's authentication.note states. Graded
    near-conformant against A2A 1.0.0 (no preferredTransport; legacy path; legacy authentication field).
