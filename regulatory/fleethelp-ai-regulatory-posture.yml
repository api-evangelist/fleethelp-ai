signals:
  subprocessors:
    url: https://fleethelp.ai/data/
    dated: '2026-07-08'
    named: [Telegram (messaging layer), Stripe (payments)]
    evidence: >-
      Data Handling page, section "Subprocessors", last updated July 8, 2026: "FleetHelp uses Telegram as
      the messaging layer (Telegram's privacy policy applies to messages in transit). Payments are processed
      by Stripe. No other third parties receive your support conversation data." A closed, named, dated
      list on a page whose whole subject is data handling — substance, not the word. It is a two-line
      section, not a table, and carries no processing-location column; recorded as published because it
      names every processor and states that the list is exhaustive.
  data_subject_request:
    url: https://fleethelp.ai/data/
    channel: email to support (address obfuscated on the page; no form, no API)
    evidence: >-
      Data Handling page: "If you want your incident history deleted, contact support and we'll remove it."
      and "You can request earlier deletion at any time by contacting support." Also states retention
      ("Incident history is retained for 12 months from the date of each conversation, then deleted") and
      post-cancellation deletion ("deleted within 30 days"). A deletion-on-request commitment with a stated
      channel; no access/portability right is described, and no timeline for honouring a request is given.
